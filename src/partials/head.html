<!doctype html>
<!-- Generated by build.js from src/ (pages, partials, i18n). Edit those, then run: node build.js -->
<html lang="{{@lang}}" dir="{{@dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{attr:meta.title}}</title>
<meta name="description" content="{{attr:meta.description}}">
<link rel="canonical" href="{{@url}}">
{{@hreflang}}
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<meta name="theme-color" content="#6366f1">
<meta name="application-name" content="DiffDuo">

<meta property="og:type" content="website">
<meta property="og:site_name" content="DiffDuo">
<meta property="og:url" content="{{@url}}">
<meta property="og:locale" content="{{@ogLocale}}">
{{@ogAlternates}}
<meta property="og:title" content="{{attr:meta.ogTitle}}">
<meta property="og:description" content="{{attr:meta.ogDescription}}">
<meta property="og:image" content="https://diffduo.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{attr:meta.ogImageAlt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{attr:meta.ogTitle}}">
<meta name="twitter:description" content="{{attr:meta.twitterDescription}}">
<meta name="twitter:image" content="https://diffduo.com/og-image.png">

<link rel="icon" href="{{@root}}favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{@root}}favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{{@root}}apple-touch-icon.png">
<link rel="manifest" href="{{@root}}site.webmanifest">

<script type="application/ld+json">
{{@jsonld}}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
{{>style.css}}
</style>
</head>
